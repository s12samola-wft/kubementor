[project]
name = "kubementor"
version = "0.1.0"
description = "A hands-on Kubernetes learning platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Explicit list so a Ruff upgrade cannot silently change what CI enforces.
# E/W pycodestyle, F pyflakes, I import order, B bugbear, BLE blind except,
# UP modern syntax, S security (bandit).
select = ["E", "W", "F", "I", "B", "BLE", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest uses plain assert; test configs use fake secrets on purpose.
"tests/**" = ["S101", "S105"]
